
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sci-Fi Space Defender</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>SPACE DEFENDER</h1>

    <h2 class="creator">Created by: Raiden</h2>

    <p class="game-lore">
        DEFEND YOUR WORLD!!!
        <br>
        The galaxy is under attack! Destroy the invading alien fleet
        before they reach your home planet.
    </p>

    <div id="scoreboard">
        SCORE: <span id="score">0</span> |
        LIVES: <span id="lives">3</span>
    </div>

    <canvas id="gameCanvas" width="540" height="400"></canvas>

    <button id="playAgain" disabled>Play</button>

    <div class="instructions">
        Use [←] [→] Arrow Keys to Move.
        <br>
        Press [Spacebar] to Fire Torpedoes.
    </div>

    <audio id="backgroundMusic" src="space.mp3" loop preload="auto"></audio>

    <script src="script.js"></script>
</body>
</html>
